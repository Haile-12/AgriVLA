[project]
name = "agrivla"
version = "0.1.0"
description = "Closed-Loop Vision-Language Agent for Adaptive Agricultural Decision Making"
requires-python = ">=3.11"
dependencies = [
    # ── Web Framework ──────────────────────────────────────────────────────
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.25.0",
    "python-multipart>=0.0.6",
    "starlette>=0.27.0",

    # ── Data Validation ────────────────────────────────────────────────────
    "pydantic[email]>=2.4.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.0.0",

    # ── Database ───────────────────────────────────────────────────────────
    "motor>=3.3.0",
    "pymongo>=4.5.0",
    "redis>=5.0.0",
    "dnspython>=2.4.0",

    # ── Authentication ─────────────────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "cryptography>=41.0.0",

    # ── Vision-Language Model (Gemini API) ─────────────────────────────────
    "google-genai>=0.2.0",

    # ── HuggingFace Hub ────────────────────────────────────────────────────
    "huggingface_hub>=0.16.4,<1.0",
    "filelock>=3.13.0",

    # ── RAG / Embeddings ───────────────────────────────────────────────────
    "qdrant-client>=1.7.0",
    # fastembed uses ONNX Runtime (no PyTorch) — stable on Windows and highly portable
    "fastembed>=0.2.0",

    # ── Image Processing ───────────────────────────────────────────────────
    "pillow>=10.0.0",
    "torchvision>=0.15.0",

    # ── Numeric / Scientific ───────────────────────────────────────────────
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "sympy>=1.12.0",

    # ── Plotting ───────────────────────────────────────────────────────────
    "matplotlib>=3.8.0",

    # ── HTTP / Networking ──────────────────────────────────────────────────
    "httpx>=0.25.0",
    "requests>=2.31.0",

    # ── Utilities ─────────────────────────────────────────────────────────
    "colorama>=0.4.6",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.1",
    "packaging>=23.2",
    "regex>=2023.10.3",
    "typing_extensions>=4.8.0",
    "joblib>=1.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
